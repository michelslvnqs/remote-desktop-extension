<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Remote Desktop Code Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #121826;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .header svg {
      width: 22px;
      height: 22px;
      fill: #38bdf8;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }
    .btn-primary:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #f8fafc;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .code-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0 8px 0;
      text-align: center;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .code-display {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #38bdf8;
      font-family: 'Consolas', 'Courier New', monospace;
      user-select: all;
    }
    .code-placeholder {
      font-size: 12px;
      color: #64748b;
    }
    .copy-btn {
      margin-top: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #0284c7;
      background: rgba(2, 132, 199, 0.15);
      color: #38bdf8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .copy-btn:hover {
      background: rgba(2, 132, 199, 0.3);
    }
    .status-badge {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      margin: 8px 0;
      text-align: center;
      display: none;
      word-break: break-word;
    }
    .status-badge.info {
      display: block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .status-badge.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .status-badge.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .notice {
      font-size: 11px;
      color: #94a3b8;
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 10px;
      border-left: 3px solid #f59e0b;
      line-height: 1.35;
    }
    .history-panel {
      display: none;
      margin-top: 10px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      max-height: 140px;
      overflow-y: auto;
    }
    .history-panel h4 {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .history-item {
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-code {
      font-family: monospace;
      color: #38bdf8;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24">
      <path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
    </svg>
    <h2>Remote Desktop Code</h2>
  </div>

  <button id="btnGenerate" class="btn btn-primary">
    <span id="btnIcon">⚡</span>
    <span id="btnText">Gerar Código</span>
  </button>

  <button id="btnCloseTab" class="btn btn-danger" style="display: none;">
    <span>❌</span>
    <span>Fechar Aba do Remote</span>
  </button>

  <div class="code-box">
    <div id="codeDisplay" class="code-placeholder">Clique em "Gerar Código" para começar</div>
    <button id="btnCopy" class="copy-btn" style="display: none;">📋 Copiar Código</button>
  </div>

  <div id="statusBadge" class="status-badge"></div>

  <div class="notice">
    💡 <strong>Dica:</strong> A aba do Suporte Remoto deve permanecer aberta para permitir a conexão.
  </div>

  <button id="btnView" class="btn btn-secondary">Visualizar Histórico</button>
  <div id="historyPanel" class="history-panel"></div>

  <script src="popup.js"></script>
</body>
</html>
